<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Estrelume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   VALE ESTRELINHA — fundamentos de design
   1. Grade: arte em 16×16 px por tile; UI em múltiplos de 4px (--u)
   2. Cor: paleta do pacote Ninja Adventure (CC0); contorno sempre --ink
   3. Tipo: Pixelify Sans — 700 títulos, 600 rótulos, 400 texto
   4. Raridade: 3★ azul · 4★ lilás · 5★ dourado — em todo lugar
   5. Componentes: painel de papel + moldura de madeira, botão "tecla",
      slot, carta, selo. Nada de cantos lisos ou sombras borradas.
   ========================================================= */
:root{
  --ink:#14141b; --ink-2:#4e484a;
  --paper:#fce2ca; --paper-2:#ffcba9; --paper-3:#d3865f;
  --wood-d:#543c52; --wood:#9c6546; --wood-l:#d78b4a;
  --leaf:#74a334; --leaf-d:#56864c; --sky:#52a8e6; --sky-d:#3577bd;
  --sun:#ffe18d; --sun-d:#f1c471; --berry:#ef9597; --cherry:#e0394c; --plum:#7654b6;
  --r3:#79b8ce; --r4:#a5608b; --r5:#ef914f;
  --u:4px;
  --font:'Pixelify Sans', ui-monospace, monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1d1830;font-family:var(--font);color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block}
#c{position:fixed;inset:0;display:block;touch-action:none}
#ov{position:fixed;inset:0;pointer-events:none;z-index:4}
#loading{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:linear-gradient(180deg,#a7dcff,#8fc957)}
#loading.off{display:none}
.lbox{padding:24px 30px;text-align:center;width:min(460px,90vw)}
.logo.small{font-size:40px}
.lbar{height:18px;border:4px solid var(--ink);border-radius:6px;background:var(--paper-2);margin:16px 0 8px;overflow:hidden}
.lbar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--leaf) 0 12px,var(--leaf-d) 12px 18px);transition:width .2s}
.hrt{font-size:18px;line-height:1}

/* ---------- componentes base ---------- */
.panel{background:var(--paper);border:var(--u) solid var(--ink);border-radius:calc(var(--u)*2);
  box-shadow:inset 0 0 0 var(--u) var(--wood-l),inset 0 0 0 calc(var(--u)*2) var(--paper-2),0 var(--u) 0 rgba(29,24,48,.55)}
.panel.wood{background:var(--wood);color:var(--paper);box-shadow:inset 0 0 0 var(--u) var(--wood-l),inset 0 calc(var(--u)*-2) 0 var(--wood-d),0 var(--u) 0 rgba(29,24,48,.55)}
.btn{font:600 16px/1.1 var(--font);color:var(--ink);background:var(--paper);border:var(--u) solid var(--ink);border-radius:var(--u);
  padding:10px 16px;box-shadow:inset 0 calc(var(--u)*-1) 0 var(--paper-3),0 var(--u) 0 var(--ink);cursor:pointer;transition:transform .06s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(var(--u));box-shadow:inset 0 calc(var(--u)*-1) 0 var(--paper-3)}
.btn.green{background:var(--leaf);color:#fff;text-shadow:0 2px 0 var(--leaf-d);box-shadow:inset 0 -4px 0 var(--leaf-d),0 4px 0 var(--ink)}
.btn.gold{background:var(--sun);box-shadow:inset 0 -4px 0 var(--sun-d),0 4px 0 var(--ink)}
.btn.pink{background:var(--berry);box-shadow:inset 0 -4px 0 #d96a8f,0 4px 0 var(--ink)}
.btn:disabled{filter:grayscale(.9);opacity:.55;cursor:not-allowed;transform:none}
.btn small{display:block;font-size:12px;font-weight:500;opacity:.8;margin-top:3px}
.key{display:inline-block;min-width:20px;padding:1px 5px;border:2px solid var(--ink);border-radius:4px;background:var(--paper);box-shadow:0 2px 0 var(--ink);font-weight:700;font-size:12px;text-align:center;color:var(--ink);line-height:1.2}
.tag{display:inline-block;padding:2px 8px;border-radius:var(--u);border:2px solid var(--ink);font-size:12px;font-weight:700;background:var(--paper-2)}
.r3c{color:var(--r3)}.r4c{color:var(--r4)}.r5c{color:var(--r5)}
.stars{letter-spacing:1px;font-weight:700;text-shadow:0 2px 0 var(--ink)}

/* ---------- HUD ---------- */
.hud{position:fixed;z-index:5}
#hudTL{top:12px;left:12px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;min-width:190px}
#hearts{display:flex;gap:2px}#hearts img{width:22px;height:20px}
.money{display:flex;align-items:center;gap:6px;font-weight:700;font-size:20px}
.money img{width:22px;height:22px}
#clock{font-size:14px;font-weight:600;display:flex;gap:6px;align-items:center;color:var(--ink-2)}
#hudTR{top:12px;right:12px;width:236px;padding:10px 14px}
#hudTR h4{font-size:14px;margin-bottom:6px;display:flex;justify-content:space-between}
.q{font-size:13px;margin:5px 0}
.q .bar{height:8px;border:2px solid var(--ink);border-radius:3px;background:var(--paper-2);margin-top:2px;overflow:hidden}
.q .bar i{display:block;height:100%;background:var(--leaf)}
.q.done{opacity:.55;text-decoration:line-through}
#hotbar{left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:4px;padding:8px}
.slot{width:52px;height:52px;border:var(--u) solid var(--ink);border-radius:var(--u);background:var(--paper-2);position:relative;display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 -4px 0 var(--paper-3)}
.slot img{width:40px;height:40px}
.slot .n{position:absolute;left:2px;top:0;font-size:11px;font-weight:700}
.slot .c{position:absolute;right:1px;bottom:-1px;font-size:11px;font-weight:700;background:var(--paper);padding:0 2px;border-radius:2px}
.slot.on{background:var(--sun);transform:translateY(-6px);box-shadow:inset 0 -4px 0 var(--sun-d),0 4px 0 var(--ink)}
#toolname{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);font-weight:700;font-size:14px;color:#fff;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink);z-index:5;pointer-events:none}
#hudBR{right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px}
.rb{width:56px;height:56px;padding:0;display:grid;place-items:center;font-size:11px;position:relative}
.rb img{width:32px;height:32px}
.rb .k{position:absolute;top:-8px;right:-8px}
#hudBL{left:12px;bottom:12px;padding:8px 12px;display:flex;gap:10px;align-items:center;max-width:290px}
#hudBL img{width:48px;height:48px}
#petname{font-weight:700;font-size:14px}#petperk{font-size:12px;color:var(--ink-2);line-height:1.25}
#prompt{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);padding:8px 14px;font-weight:600;z-index:6;opacity:0;transition:opacity .12s;pointer-events:none;white-space:nowrap}
#prompt.on{opacity:1}
#toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-30px);padding:10px 18px;font-weight:600;opacity:0;transition:all .25s;z-index:58;pointer-events:none;text-align:center;max-width:min(520px,90vw)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#dayban{position:fixed;inset:0;display:grid;place-items:center;z-index:39;pointer-events:none;opacity:0;transition:opacity .6s}
#dayban.on{opacity:1}
#dayban div{font-size:44px;font-weight:700;color:#fff;text-shadow:0 4px 0 var(--ink),4px 0 0 var(--ink),-4px 0 0 var(--ink),0 -4px 0 var(--ink)}

/* ---------- diálogo ---------- */
#dlg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(720px,94vw);padding:16px 18px 14px 110px;z-index:30;display:none;min-height:118px;cursor:pointer}
#dlg.on{display:block}
#dlgface{position:absolute;left:14px;top:14px;width:84px;height:84px;border:var(--u) solid var(--ink);border-radius:var(--u);background:var(--paper-2)}
#dlgname{position:absolute;left:110px;top:-18px;padding:3px 12px;font-weight:700}
#dlgtxt{font-size:18px;line-height:1.45;min-height:52px}
#dlgmore{position:absolute;right:16px;bottom:8px;animation:blink 1s steps(2) infinite;font-weight:700}
@keyframes blink{50%{opacity:0}}

/* ---------- modais ---------- */
#modal{position:fixed;inset:0;background:rgba(29,24,48,.6);z-index:55;display:none;overflow:auto;padding:24px 12px}
#modal.on{display:block}
.mp{max-width:940px;margin:0 auto;padding:20px 22px 22px;position:relative}
.mp h2{font-size:28px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.mp h2 img{width:36px;height:36px}
.xb{position:absolute;right:14px;top:14px;width:40px;height:40px;padding:0;font-size:18px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab.on{background:var(--sun);box-shadow:inset 0 -4px 0 var(--sun-d),0 4px 0 var(--ink)}

/* gacha */
.wb{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:760px){.wb{grid-template-columns:1fr}}
.bart{position:relative;border:var(--u) solid var(--ink);border-radius:calc(var(--u)*2);min-height:330px;overflow:hidden;
  background:linear-gradient(180deg,var(--a),var(--b));display:grid;place-items:center}
.bart .sky{position:absolute;inset:0;background-image:radial-gradient(#fff 1.5px,transparent 2px),radial-gradient(#fff8 1px,transparent 1.5px);background-size:46px 46px,23px 23px;background-position:0 0,11px 17px;opacity:.7;animation:tw 4s steps(4) infinite}
@keyframes tw{50%{opacity:.35}}
.bart .hill{position:absolute;left:-10%;right:-10%;bottom:-40px;height:110px;background:var(--leaf);border-top:var(--u) solid var(--ink);border-radius:50% 50% 0 0}
.bart .feat{position:relative;width:200px;height:200px;animation:bob 1.2s steps(2) infinite;filter:drop-shadow(0 8px 0 rgba(29,24,48,.35))}
@keyframes bob{50%{transform:translateY(-8px)}}
.bart .ribbon{position:absolute;top:14px;left:14px;padding:4px 10px;font-weight:700;font-size:13px}
.bart .ups{position:absolute;bottom:12px;right:12px;display:flex;gap:6px}
.bart .ups img{width:48px;height:48px;background:var(--paper);border:3px solid var(--ink);border-radius:4px}
.bname{font-size:30px;font-weight:700;line-height:1}
.bsub{margin:6px 0 10px;font-weight:600}
.perk{background:var(--paper-2);border:3px solid var(--ink);border-radius:var(--u);padding:8px 10px;font-size:14px;line-height:1.35;margin-bottom:10px}
.pity{font-size:14px;line-height:1.7;margin-bottom:10px}
.meter{height:14px;border:3px solid var(--ink);border-radius:4px;background:var(--paper-2);overflow:hidden}
.meter i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--sun) 0 8px,var(--sun-d) 8px 12px)}
.wbtns{display:flex;gap:10px;flex-wrap:wrap}.wbtns .btn{flex:1;min-width:150px;font-size:18px}
.rates{font-size:12px;color:var(--ink-2);margin-top:12px;line-height:1.45}

/* cartas */
.card{width:132px;height:182px;perspective:600px}
.card .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.card .fa,.card .ba{position:absolute;inset:0;backface-visibility:hidden;border:var(--u) solid var(--ink);border-radius:calc(var(--u)*2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.card .ba{background:var(--wood) repeating-linear-gradient(0deg,transparent 0 10px,var(--wood-d) 10px 12px);box-shadow:inset 0 0 0 4px var(--wood-l)}
.card .ba::after{content:'✦';font-size:44px;color:var(--sun);text-shadow:0 4px 0 var(--ink)}
.card .fa{transform:rotateY(180deg);background:var(--paper);box-shadow:inset 0 0 0 4px var(--rc)}
.card img{width:84px;height:84px}
.card .fa{padding:6px;text-align:center}
.card .nm{font-weight:700;font-size:14px;line-height:1.05}
.card .sp{font-size:11px;color:var(--ink-2)}
.card .tg{font-size:11px;font-weight:700;padding:1px 6px;border:2px solid var(--ink);border-radius:3px;background:var(--leaf);color:#fff}
.card.r3{--rc:var(--r3)}.card.r4{--rc:var(--r4)}.card.r5{--rc:var(--r5)}
.card.r4 .fa{background:linear-gradient(180deg,#efe3ff,var(--paper))}
.card.r5 .fa{background:linear-gradient(180deg,#fff0c4,var(--paper));animation:shine 1.2s steps(3) infinite}
@keyframes shine{50%{box-shadow:inset 0 0 0 4px var(--r5),0 0 0 4px var(--sun),0 0 26px var(--sun)}}
.card.r4.flip .fa{box-shadow:inset 0 0 0 4px var(--r4),0 0 18px var(--r4)}

#wish{position:fixed;inset:0;z-index:35;display:none;background:radial-gradient(circle at 50% 40%,#3b2f6b,#141026);overflow:auto}
#wish.on{display:block}
#wish .sky{position:absolute;inset:0;background-image:radial-gradient(#fff 1.5px,transparent 2px);background-size:40px 40px;opacity:.5}
.stage{position:absolute;inset:0;display:grid;place-items:center}
.bigwell{width:300px;height:300px;position:relative;z-index:2}
.coin{position:absolute;left:50%;top:-40px;font-size:36px;margin-left:-18px;z-index:3;animation:drop .9s cubic-bezier(.5,0,1,.6) forwards}
@keyframes drop{to{top:calc(50% + 10px);transform:scale(.6)}}
.wglow{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border-radius:50%;background:var(--c);box-shadow:0 0 80px 60px var(--c);opacity:0;z-index:1}
.wglow.go{animation:wg 1.4s ease-out forwards}
@keyframes wg{0%{opacity:0;transform:scale(.2)}35%{opacity:1;transform:scale(3)}100%{opacity:.0;transform:scale(14)}}
.cards{position:relative;display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:780px;margin:40px auto 20px;padding:0 10px;z-index:2}
.cfoot{position:relative;text-align:center;padding-bottom:30px;z-index:2}
.skip{position:absolute;right:16px;bottom:16px;z-index:4}
.confetti{position:fixed;width:8px;height:8px;z-index:36;pointer-events:none;animation:conf 1.6s ease-out forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}

/* álbum + mochila */
.ab{display:grid;grid-template-columns:1fr 260px;gap:18px}
@media(max-width:760px){.ab{grid-template-columns:1fr}}
.grid{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.mini{width:104px;padding:6px 4px;border:var(--u) solid var(--ink);border-radius:calc(var(--u)*1.5);background:var(--paper);text-align:center;cursor:pointer;box-shadow:inset 0 0 0 3px var(--rc,var(--paper-3))}
.mini.r3{--rc:var(--r3)}.mini.r4{--rc:var(--r4)}.mini.r5{--rc:var(--r5)}
.mini img{width:64px;height:64px}
.mini .nm{font-weight:700;font-size:13px}
.mini.lock img{filter:brightness(0) opacity(.35)}
.mini.lock .nm{opacity:.5}
.mini.sel{transform:translateY(-4px);box-shadow:inset 0 0 0 3px var(--rc),0 4px 0 var(--ink)}
.mini .eq{font-size:10px;font-weight:700;color:#fff;background:var(--leaf);border:2px solid var(--ink);border-radius:3px;padding:0 4px}
.det{padding:14px;background:var(--paper-2);border:3px solid var(--ink);border-radius:var(--u);align-self:start;text-align:center}
.det img{width:128px;height:128px}
.det h3{font-size:24px}
.det p{font-size:14px;line-height:1.4;margin:8px 0;text-align:left}
.hearts{color:var(--cherry);font-size:16px;letter-spacing:2px}
.inv{display:flex;flex-wrap:wrap;gap:8px}
.it{width:96px;padding:8px 4px;border:3px solid var(--ink);border-radius:var(--u);background:var(--paper-2);text-align:center}
.it img{width:40px;height:40px}.it b{display:block;font-size:13px}.it span{font-size:12px;color:var(--ink-2)}
.qrow{display:flex;gap:12px;align-items:center;padding:10px;border:3px solid var(--ink);border-radius:var(--u);background:var(--paper-2);margin-bottom:8px}
.qrow .grow{flex:1}.qrow .meter i{background:var(--leaf)}
.note{font-size:13px;color:var(--ink-2);margin-top:10px}

/* título */
#title{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:linear-gradient(180deg,rgba(29,24,48,.15),rgba(29,24,48,.55))}
#title.off{display:none}
body.ttl .hud{display:none!important}
.tbox{text-align:center;padding:26px 30px 22px;max-width:560px;width:92vw}
.logo{font-size:64px;font-weight:700;line-height:.95;color:var(--sun);text-shadow:0 6px 0 var(--ink),4px 0 0 var(--ink),-4px 0 0 var(--ink),0 -4px 0 var(--ink),4px 6px 0 var(--ink),-4px 6px 0 var(--ink)}
.logo span{color:var(--berry)}
.tline{margin:14px 0 10px;font-size:16px;color:var(--paper);text-shadow:0 2px 0 var(--ink)}
.tpets{display:flex;gap:6px;justify-content:center;margin:8px 0 16px}
.tpets img{width:56px;height:56px;animation:bob 1s steps(2) infinite}
.tpets img:nth-child(2n){animation-delay:.5s}
#play{font-size:24px;padding:14px 40px}
.ctr{margin-top:16px;padding:12px 14px;font-size:13px;line-height:2;text-align:left}

/* toque */
#touch{display:none}
@media (hover:none) and (pointer:coarse){
  #touch{display:block}#hudTR{width:180px;font-size:12px}#hudBL{display:none}
  #hotbar{bottom:8px}.slot{width:44px;height:44px}.slot img{width:32px;height:32px}
  #hudBR{bottom:auto;top:50%;transform:translateY(-50%)}
}
#stick{position:fixed;left:24px;bottom:90px;width:120px;height:120px;border-radius:50%;background:rgba(251,241,217,.25);border:4px solid rgba(58,43,60,.6);z-index:8}
#knob{position:absolute;left:36px;top:36px;width:40px;height:40px;border-radius:50%;background:var(--paper);border:4px solid var(--ink)}
.tbtn{position:fixed;z-index:8;width:64px;height:64px;border-radius:50%;font-size:22px;padding:0}

/* objetivo guiado + dica contextual */
#goal{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:6;padding:8px 16px 10px;text-align:center;display:none;max-width:min(560px,70vw)}
#goal.on{display:block;animation:pop .4s}
@keyframes pop{0%{transform:translateX(-50%) scale(.9)}60%{transform:translateX(-50%) scale(1.04)}100%{transform:translateX(-50%)}}
.gstep{font-size:12px;font-weight:700;color:var(--wood);text-transform:uppercase;letter-spacing:1px}
.gtxt{font-size:18px;font-weight:600;margin:2px 0 4px}
.gkeys .key{font-size:13px}
#hint{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:6;display:none;gap:14px;padding:6px 14px;font-weight:600;font-size:15px;white-space:nowrap;pointer-events:none}
#hint.on{display:flex}
#hint .dim{opacity:.6}
#hint .hrow{display:flex;gap:6px;align-items:center}
#toast{top:auto;bottom:150px;transform:translate(-50%,20px)}
#toast.on{transform:translate(-50%,0)}
#dlgface{width:84px;height:84px;padding:2px;background:#ffcba9;object-fit:cover}
.lead{margin:-4px 0 12px;font-size:15px}
.cnote{color:var(--paper);margin-bottom:12px;font-size:14px}
.help{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.hc{background:var(--paper-2);border:3px solid var(--ink);border-radius:var(--u);padding:10px 12px}
.hc h4{display:flex;align-items:center;gap:8px;font-size:16px;margin-bottom:4px}
.hc p{font-size:14px;line-height:1.5}
.hi{width:28px;height:28px}
.credit{margin-top:12px;font-size:12px;color:var(--paper);text-shadow:0 2px 0 var(--ink)}
.credit a{color:var(--sun)}
details.rates summary{cursor:pointer;font-weight:600;color:var(--ink)}
.tpets img{width:64px;height:64px;background:var(--paper);border:3px solid var(--ink);border-radius:6px}
.bart .feat{width:190px;height:190px;border:4px solid var(--ink);border-radius:12px;background:var(--paper)}

#decor{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;width:min(960px,96vw);padding:10px 12px;display:none}
#decor.on{display:block}
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px}.dhead span{flex:1;color:var(--ink-2)}
.drow{display:flex;gap:8px;overflow-x:auto;padding:8px 0}.dslot{flex:0 0 92px;border:3px solid var(--ink);border-radius:var(--u);background:var(--paper-2);text-align:center;padding:4px;cursor:pointer;font-size:12px}
.dslot img{width:64px;height:64px;display:block;margin:0 auto}.dslot b{display:block;line-height:1.1}.dslot.on{background:var(--sun);transform:translateY(-3px)}
.drow2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}.chip{padding:4px 8px!important;font-size:12px!important;display:inline-flex;gap:5px;align-items:center}.chip i{width:14px;height:14px;border:2px solid var(--ink);border-radius:3px;display:inline-block}.chip.on{background:var(--sun)}
.dnote{font-size:13px;padding:8px}

.app em{position:absolute;top:2px;right:10px;font-style:normal;font-size:11px;font-weight:700;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 4px}
.app:hover,.app.sel{transform:translateY(-3px) scale(1.06)}
.app.sel i{outline:4px solid #fff;outline-offset:2px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.14),inset 0 4px 0 rgba(255,255,255,.45),0 0 0 7px var(--ink),0 6px 0 7px var(--ink)}
.phfoot{margin:12px 6px 2px;text-align:center;font-size:14px;color:var(--ink-2);min-height:18px}
@media (max-width:560px){.apps{grid-template-columns:repeat(3,1fr)}.app i{width:58px;height:58px}}
/* diálogo em balão, com nome inclinado (Animal Crossing) */
#dlg{border-radius:30px!important;padding:20px 26px 18px 120px!important;background:#fffaf2!important;box-shadow:0 5px 0 var(--ink),inset 0 0 0 5px #fff,inset 0 0 0 8px #ffe2c6!important;zoom:var(--mscale)}
#dlgface{border-radius:50%!important;left:18px!important;top:16px!important;width:88px!important;height:88px!important;box-shadow:0 3px 0 var(--ink)}
#dlgname{transform:rotate(-4deg);border-radius:14px!important;padding:5px 16px!important;font-size:17px!important;top:-20px!important;left:116px!important;background:#ff9fbd!important;color:#fff!important;text-shadow:0 2px 0 rgba(20,20,27,.35);box-shadow:0 3px 0 var(--ink)!important;animation:none!important}
#dlgtxt{font-size:19px!important;line-height:1.5!important}
#dlgmore{color:#ff7aa8;animation:dmore .7s ease-in-out infinite alternate}@keyframes dmore{to{transform:translateY(5px)}}
/* avisos em balão */
#toast{border-radius:22px!important;padding:10px 18px!important;font-size:16px;box-shadow:0 4px 0 var(--ink),inset 0 0 0 4px #fff!important;background:#fffaf2!important}
/* dica de ação: pílula clara com teclas */
#hint{border-radius:999px!important;padding:6px 16px!important;background:rgba(255,250,242,.94)!important;box-shadow:0 3px 0 var(--ink)!important}
#hint .key{border-radius:8px;min-width:24px;font-size:13px}
body[data-input=touch] #hint .key,body[data-input=pad] #hint .key{border-radius:50%;min-width:24px;height:24px;line-height:18px;padding:0}
body[data-input=pad] #hint .key{background:#ffe18d}
/* roda de ferramentas */
#ring{position:fixed;inset:0;z-index:45;display:none;background:radial-gradient(circle at 50% 50%,rgba(20,20,27,.15),rgba(20,20,27,.55));pointer-events:auto}
#ring.on{display:block;animation:ringin .2s ease-out}@keyframes ringin{from{opacity:0;transform:scale(.9)}}
#ring .rc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:150px;height:150px;border-radius:50%;background:#fffaf2;border:4px solid var(--ink);display:grid;place-content:center;text-align:center;box-shadow:0 5px 0 var(--ink)}
#ring .rc b{font-size:16px}#ring .rc small{font-size:11px;color:var(--ink-2)}
#ring .rs{position:absolute;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;background:#fff;border:4px solid var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .1s}
#ring .rs img{width:46px;height:46px;image-rendering:pixelated}#ring .rs em{position:absolute;bottom:-8px;font-style:normal;font-size:11px;font-weight:700;background:var(--paper);border:2px solid var(--ink);border-radius:6px;padding:0 4px}
#ring .rs.on{background:#ffe18d;transform:translate(-50%,-50%) scale(1.22)}
/* amigos no multiplayer */
#party{position:fixed;left:calc(12px + var(--hs,1) * 6px);top:calc(var(--hs,1) * 120px);z-index:12;display:flex;flex-direction:column;gap:6px;pointer-events:none;transform-origin:top left;transform:scale(var(--hs,1))}
#party .pm{display:flex;align-items:center;gap:8px;background:rgba(255,250,242,.95);border:3px solid var(--ink);border-radius:16px;padding:4px 10px 4px 4px;box-shadow:0 3px 0 var(--ink);min-width:150px}
#party .pm img{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:var(--paper-2);object-fit:cover}
#party .pm b{display:block;font-size:13px}#party .pm small{display:block;font-size:11px;color:var(--ink-2)}
#party .pm .dot{width:10px;height:10px;border-radius:50%;background:#8fd16a;border:2px solid var(--ink);margin-left:auto}
#party .pm.far .dot{background:#ffcb2a}
#party .pm .hpb{height:5px;border-radius:3px;background:#e0394c;margin-top:2px}
/* texto grande e menos animação */
body.bigtxt .modal,body.bigtxt #modal{font-size:110%}
body.bigtxt #hint,body.bigtxt #toast{font-size:18px}
body.calm *{animation-duration:0s!important;transition-duration:0s!important}
.seth{margin:14px 0 4px;font-size:15px}
@media (max-width:700px){#hudTR #qlist{display:none}#hudTR.open #qlist{display:block}}
/* v25: abertura com cenas */
#cut .cfl{position:absolute;inset:0;background:#fff8ee;opacity:0;pointer-events:none}
#cut .cfl.on{animation:cfl 1.1s ease-out}@keyframes cfl{0%{opacity:.85}100%{opacity:0}}
#cut .csn{position:absolute;left:6vw;top:calc(11vh + 18px);font:700 18px var(--font);color:#ffe9a8;text-shadow:0 2px 0 #2a1d2e;letter-spacing:1px;opacity:0}
#cut .csn.on{animation:csn 5s ease both}@keyframes csn{0%{opacity:0;transform:translateX(-14px)}12%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
#cut .cdots{position:absolute;right:6vw;top:calc(11vh + 22px);display:flex;gap:8px}
#cut .cdots i{width:10px;height:10px;border-radius:50%;border:2px solid #fff;opacity:.5}
#cut .cdots i.on{background:#ffe18d;opacity:1}
#cut .cap i{color:#ffe3ef}
#title .tlogo{animation:tfloat 4.5s ease-in-out infinite}@keyframes tfloat{50%{transform:translateY(-6px) rotate(-1deg)}}
</style>
</head>
